<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickandPrint3D Quote Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        #canvas-container { width: 100%; height: 100%; min-height: 400px; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        .drag-active { border-color: #3b82f6; background-color: #eff6ff; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <svg class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                    <span class="ml-2 text-xl font-bold text-gray-900">ClickandPrint3D</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col lg:flex-row gap-8">
        
        <div class="w-full lg:w-3/5 flex flex-col gap-6">
            
            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center transition-colors duration-200 bg-white hover:bg-gray-50 flex flex-col items-center justify-center min-h-[200px]">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="mt-4 flex text-sm text-gray-600">
                    <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                        <span>Upload a file</span>
                        <input id="file-upload" name="file-upload" type="file" class="sr-only" accept=".stl">
                    </label>
                    <p class="pl-1">or drag and drop</p>
                </div>
                <p class="text-xs text-gray-500 mt-2">Currently supporting STL files up to 50MB</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative flex-grow min-h-[400px]">
                <div id="viewer-overlay" class="absolute inset-0 flex items-center justify-center bg-gray-50 z-10">
                    <p class="text-gray-500 font-medium">Upload a model to preview</p>
                </div>
                <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-white bg-opacity-80 z-20 hidden">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                </div>
                <div id="canvas-container"></div>
            </div>
        </div>

        <div class="w-full lg:w-2/5 flex flex-col gap-6">
            
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h3 class="text-lg font-medium text-gray-900 border-b pb-2 mb-4">Model Specifications</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <p class="text-xs text-gray-500 font-medium uppercase tracking-wider mb-1">Dimensions (mm)</p>
                        <p id="dim-x" class="text-sm font-semibold text-gray-800">X: --</p>
                        <p id="dim-y" class="text-sm font-semibold text-gray-800">Y: --</p>
                        <p id="dim-z" class="text-sm font-semibold text-gray-800">Z: --</p>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 flex flex-col justify-center">
                        <p class="text-xs text-gray-500 font-medium uppercase tracking-wider mb-1">Est. Volume</p>
                        <p id="volume-display" class="text-2xl font-bold text-blue-600">-- <span class="text-sm font-medium text-gray-500">cm³</span></p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex-grow">
                <h3 class="text-lg font-medium text-gray-900 border-b pb-2 mb-4">Request a Quote</h3>
                <form id="quote-form" class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number (Optional)</label>
                        <input type="tel" id="phone" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                    </div>
                    <div>
                        <label for="material" class="block text-sm font-medium text-gray-700">Material</label>
                        <select id="material" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border bg-white">
                            <option value="PLA">PLA</option>
                        </select>
                    </div>
                    <div>
                        <label for="comments" class="block text-sm font-medium text-gray-700">Special Requests</label>
                        <textarea id="comments" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"></textarea>
                    </div>
                    
                    <button type="submit" id="submit-btn" disabled class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        Submit for Quote
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 text-center">
            <p class="text-sm text-gray-500">Contact us at: <a href="mailto:danielaylward14@gmail.com" class="text-blue-600 hover:text-blue-500 font-medium">danielaylward14@gmail.com</a></p>
        </div>
    </footer>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center z-50">
        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-message">Quote submitted successfully!</span>
    </div>

    <script>
        // --- State Variables ---
        let currentFile = null;
        let modelDimensions = { x: 0, y: 0, z: 0 };
        let modelVolumeCm3 = 0;
        
        // --- Three.js Setup ---
        let scene, camera, renderer, controls, currentMesh;
        const container = document.getElementById('canvas-container');

        window.onload = function() {
            initThreeJS();
            setupDragAndDrop();
            setupForm();
            animate();
        };

        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc); // Tailwind gray-50

            // Camera
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 10000);
            camera.position.set(100, 100, 100);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Environment / Grid
            const gridHelper = new THREE.GridHelper(500, 50, 0x888888, 0xd1d5db);
            gridHelper.position.y = -0.1;
            scene.add(gridHelper);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Soft white light
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(100, 200, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
            fillLight.position.set(-100, 0, -50);
            scene.add(fillLight);

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            if(!camera || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // --- File Handling & Processing ---
        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-upload');

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-active'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-active'), false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            });

            fileInput.addEventListener('change', function() {
                handleFiles(this.files);
            });
        }

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            // Basic validation
            const extension = file.name.split('.').pop().toLowerCase();
            if (extension !== 'stl') {
                showToast("Only STL files are supported currently.", true);
                return;
            }

            currentFile = file;
            document.getElementById('loading-spinner').classList.remove('hidden');
            document.getElementById('viewer-overlay').classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                const contents = e.target.result;
                loadSTL(contents);
            };
            reader.readAsArrayBuffer(file);
        }

        function loadSTL(arrayBuffer) {
            try {
                const loader = new THREE.STLLoader();
                const geometry = loader.parse(arrayBuffer);
                
                // Remove existing mesh if any
                if (currentMesh) {
                    scene.remove(currentMesh);
                    currentMesh.geometry.dispose();
                    currentMesh.material.dispose();
                }

                // Create Material & Mesh
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0x3b82f6, // Tailwind blue-600
                    roughness: 0.4,
                    metalness: 0.1
                });
                currentMesh = new THREE.Mesh(geometry, material);
                currentMesh.castShadow = true;
                currentMesh.receiveShadow = true;

                // Geometry Calculations
                geometry.computeBoundingBox();
                geometry.computeBoundingSphere();
                
                // Calculate Dimensions
                const box = geometry.boundingBox;
                const size = new THREE.Vector3();
                box.getSize(size);
                
                modelDimensions = { x: size.x, y: size.y, z: size.z };
                
                // Calculate Volume (Volume in mm3, convert to cm3)
                const volumeMm3 = calculateVolume(geometry);
                modelVolumeCm3 = volumeMm3 / 1000;

                updateUIStats();

                // Center the geometry visually
                geometry.center();
                
                // Adjust Camera to fit object
                const radius = geometry.boundingSphere.radius;
                camera.position.set(radius * 1.5, radius * 1.5, radius * 2);
                controls.target.set(0, 0, 0);
                controls.update();

                scene.add(currentMesh);
                
                // Enable Form Submit
                document.getElementById('submit-btn').disabled = false;
            } catch (err) {
                console.error("Error parsing STL:", err);
                showToast("Error parsing file. Ensure it is a valid STL.", true);
            } finally {
                document.getElementById('loading-spinner').classList.add('hidden');
            }
        }

        function calculateVolume(geometry) {
            // Three.js STLLoader returns BufferGeometry which is typically non-indexed for STL
            let volume = 0;
            let position = geometry.attributes.position;
            let p1 = new THREE.Vector3(), p2 = new THREE.Vector3(), p3 = new THREE.Vector3();
            
            if (geometry.index) {
                // Handle indexed geometry
                let indices = geometry.index.array;
                for (let i = 0; i < indices.length; i += 3) {
                    p1.fromBufferAttribute(position, indices[i]);
                    p2.fromBufferAttribute(position, indices[i + 1]);
                    p3.fromBufferAttribute(position, indices[i + 2]);
                    volume += signedVolumeOfTriangle(p1, p2, p3);
                }
            } else {
                // Handle non-indexed geometry
                for (let i = 0; i < position.count; i += 3) {
                    p1.fromBufferAttribute(position, i);
                    p2.fromBufferAttribute(position, i + 1);
                    p3.fromBufferAttribute(position, i + 2);
                    volume += signedVolumeOfTriangle(p1, p2, p3);
                }
            }
            return Math.abs(volume);
        }

        function signedVolumeOfTriangle(p1, p2, p3) {
            return p1.dot(p2.cross(p3)) / 6.0;
        }

        function updateUIStats() {
            document.getElementById('dim-x').innerText = `X: ${modelDimensions.x.toFixed(2)}`;
            document.getElementById('dim-y').innerText = `Y: ${modelDimensions.y.toFixed(2)}`;
            document.getElementById('dim-z').innerText = `Z: ${modelDimensions.z.toFixed(2)}`;
            document.getElementById('volume-display').innerHTML = `${modelVolumeCm3.toFixed(2)} <span class="text-sm font-medium text-gray-500">cm³</span>`;
        }

        // --- Form Handling ---
        function setupForm() {
            const form = document.getElementById('quote-form');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentFile) return;

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div> Processing...';

                const formData = new FormData();
                formData.append('file', currentFile);
                formData.append('name', document.getElementById('name').value);
                formData.append('email', document.getElementById('email').value);
                formData.append('phone', document.getElementById('phone').value);
                formData.append('material', document.getElementById('material').value);
                formData.append('comments', document.getElementById('comments').value);
                formData.append('dimensions', JSON.stringify(modelDimensions));
                formData.append('volume', modelVolumeCm3.toFixed(2));

                try {
                    // 1. Simulate a realistic 1.5-second network delay
                    await new Promise(resolve => setTimeout(resolve, 1500)); 
                    
                    // 2. Pretend the server responded perfectly
                    showToast("Quote requested successfully!");
                    form.reset();
                    
                    // (Optional) Log the data to your console so you can see what WOULD have been sent
                    console.log("Data ready for backend:", Object.fromEntries(formData));

                } catch(err) {
                    showToast("Submission failed.", true);
                } finally {
                    // Reset the button
                    submitBtn.innerText = "Submit for Quote";
                    submitBtn.disabled = false;
                }
            });
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            
            if (isError) {
                toast.classList.remove('bg-green-500');
                toast.classList.add('bg-red-500');
            } else {
                toast.classList.remove('bg-red-500');
                toast.classList.add('bg-green-500');
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

    </script>
</body>
</html>
